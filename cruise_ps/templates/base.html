<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Автоматизация обработки информации по работе туристической фирмы" }}</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Arial; margin: 20px; color:#222; }
    a { color:#0b5ed7; text-decoration:none; }
    nav a { margin-right:14px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .btn { display:inline-block; padding:8px 12px; border:1px solid #0b5ed7; border-radius:8px; }
    .btn:hover { background:#0b5ed7; color:#fff; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border:1px solid #ddd; padding:6px 8px; }
    th { background:#f7f7f7; }
    .grid {
    display: grid;
    gap: 24px;
    grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
  }
  .card { border:1px solid #eee; border-radius:12px; padding:20px; }
  img.plot { width:100%; height:auto; display:block; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Программная система «Автоматизация обработки информации по работе туристической фирмы»</h1>
      <nav>
        <a href="/">Главная</a>
        <a href="/data/clients">Клиенты</a>
        <a href="/data/bookings">Путёвки</a>
        <a href="/add">Добавить</a>
        <a href="/analytics">Аналитика</a>
      </nav>
      <hr>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
